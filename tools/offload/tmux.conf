# For the remote machine: a chat attached from your main machine should look like a local one.
# No status bar: the VS Code tab already names the chat.
set -g status off
# Wheel scrolls tmux history; without this the terminal turns the wheel into
# Up/Down keys, which walk Claude's prompt history instead of scrolling.
set -g mouse on
set -g history-limit 50000
# Claude draws in 24-bit color.
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
# Size to the terminal in use, not the smallest one ever attached.
set -g window-size latest
setw -g aggressive-resize on
